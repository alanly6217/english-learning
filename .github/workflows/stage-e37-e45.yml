name: Stage E37-E45 batch
permissions:
  contents: write
on:
  push:
    branches: [batch-e37-e45-stage]
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode validated batch
        shell: bash
        run: |
          cat > /tmp/batch.b64 <<'B64'
[... ELLIPSIZATION ...]
B64
          base64 -d /tmp/batch.b64 > /tmp/batch.tar.gz
          tar -xzf /tmp/batch.tar.gz -C .
          rm -f .github/workflows/stage-e37-e45.yml
      - name: Commit staged batch
        shell: bash
        run: |
          git config user.name 'alanly6217'
          git config user.email 'alanly6217@gmail.com'
          git add -A
          git commit -m 'feat: add vocabulary lessons E37-E45'
          git push origin HEAD:batch-e37-e45-stage
