name: Validate vocabulary data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate vocabulary lessons
        run: node scripts/validate-vocab.mjs
      - name: Export audit lesson files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocab-audit-input
          path: |
            vocab-e28.js
            vocab-e29.js
            vocab-e30.js
          if-no-files-found: error
          retention-days: 1
